name: partynova
description: PartyNova social voice chat app
publish_to: "none"
version: 1.0.0+1

environment:
sdk: ">=3.3.0 <4.0.0"

dependencies:
flutter:
sdk: flutter

cupertino_icons: ^1.0.8
shared_preferences: ^2.5.3

firebase_core: ^4.0.0
firebase_auth: ^6.0.0
cloud_firestore: ^6.0.0
firebase_storage: ^13.0.0

image_picker: ^1.2.0
image_cropper: ^10.0.0

dev_dependencies:
flutter_test:
sdk: flutter
flutter_lints: ^5.0.0
flutter_launcher_icons: ^0.14.4

flutter:
uses-material-design: true

assets:
- assets/games/
- assets/frames/

flutter_launcher_icons:
android: true
ios: false
image_path: "icon/a_clean_high_resolution_app_icon_style_graphic_wi.png"
adaptive_icon_background: "#090510"
adaptive_icon_foreground: "icon/a_clean_high_resolution_app_icon_style_graphic_wi.png"
