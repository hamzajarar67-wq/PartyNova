name: Build PartyNova APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --platforms=android --org com.partynova .

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "ndk;28.2.13676358"

      - name: Set Android compile SDK
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          app = next(
              (p for p in [
                  Path("android/app/build.gradle.kts"),
                  Path("android/app/build.gradle"),
              ] if p.exists()),
              None
          )

          if app is None:
              raise SystemExit("ERROR: Android app Gradle file not found.")

          text = app.read_text()

          patterns = [
              (r'compileSdk\s*=\s*flutter\.compileSdkVersion',
               'compileSdk = 36'),
              (r'compileSdk\s*=\s*flutter\.compileSdk',
               'compileSdk = 36'),
              (r'compileSdkVersion\s+flutter\.compileSdkVersion',
               'compileSdkVersion 36'),
              (r'compileSdk\s+flutter\.compileSdkVersion',
               'compileSdk 36'),
              (r'compileSdkVersion\s*=\s*\d+',
               'compileSdkVersion = 36'),
              (r'compileSdkVersion\s+\d+',
               'compileSdkVersion 36'),
              (r'compileSdk\s*=\s*\d+',
               'compileSdk = 36'),
              (r'compileSdk\s+\d+',
               'compileSdk 36'),
          ]

          for pattern, replacement in patterns:
              updated, count = re.subn(pattern, replacement, text, count=1)
              if count:
                  app.write_text(updated)
                  print(f"App compile SDK set to 36: {app}")
                  break
          else:
              raise SystemExit("ERROR: Could not update app compile SDK.")

          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Set Android plugin compile SDK
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"

          plugin_names = [
              "image_cropper-*",
              "image_picker_android-*",
              "shared_preferences_android-*",
              "flutter_plugin_android_lifecycle-*",
          ]

          updated_files = []

          for pattern in plugin_names:
              for plugin in root.glob(pattern):
                  for gradle in [
                      plugin / "android" / "build.gradle",
                      plugin / "android" / "build.gradle.kts",
                  ]:
                      if not gradle.exists():
                          continue

                      text = gradle.read_text()

                      patterns = [
                          (r'compileSdk\s*=\s*flutter\.compileSdkVersion',
                           'compileSdk = 36'),
                          (r'compileSdk\s*=\s*flutter\.compileSdk',
                           'compileSdk = 36'),
                          (r'compileSdkVersion\s+flutter\.compileSdkVersion',
                           'compileSdkVersion 36'),
                          (r'compileSdk\s+flutter\.compileSdkVersion',
                           'compileSdk 36'),
                          (r'compileSdkVersion\s*=\s*\d+',
                           'compileSdkVersion = 36'),
                          (r'compileSdkVersion\s+\d+',
                           'compileSdkVersion 36'),
                          (r'compileSdk\s*=\s*\d+',
                           'compileSdk = 36'),
                          (r'compileSdk\s+\d+',
                           'compileSdk 36'),
                      ]

                      for pattern, replacement in patterns:
                          updated, count = re.subn(
                              pattern, replacement, text, count=1
                          )
                          if count:
                              gradle.write_text(updated)
                              updated_files.append(str(gradle))
                              break

          for file in updated_files:
              print("Updated plugin compile SDK:", file)

          cropper_files = [
              p for p in root.glob("image_cropper-*/android/*")
              if p.name in ("build.gradle", "build.gradle.kts")
          ]

          if not cropper_files:
              raise SystemExit(
                  "ERROR: image_cropper Gradle file was not found."
              )

          print("Android plugin compile SDK adjustment completed.")
          PY

      - name: Configure Firebase
        shell: bash
        run: |
          set -e

          if [ ! -f "google-services (4).json" ]; then
            echo "ERROR: Firebase configuration file not found."
            exit 1
          fi

          mkdir -p android/app

          cp "google-services (4).json" \
            android/app/google-services.json

          python3 <<'PY'
          from pathlib import Path
          import re

          android = Path("android")

          settings = next(
              (p for p in [
                  android / "settings.gradle.kts",
                  android / "settings.gradle",
              ] if p.exists()),
              None
          )

          app = next(
              (p for p in [
                  android / "app" / "build.gradle.kts",
                  android / "app" / "build.gradle",
              ] if p.exists()),
              None
          )

          if settings is None or app is None:
              raise SystemExit("ERROR: Android Gradle files not found.")

          declaration = (
              'id("com.google.gms.google-services") version "4.4.2" apply false'
              if settings.name.endswith(".kts")
              else 'id "com.google.gms.google-services" version "4.4.2" apply false'
          )

          application = (
              'id("com.google.gms.google-services")'
              if app.name.endswith(".kts")
              else 'id "com.google.gms.google-services"'
          )

          text = settings.read_text()

          if "com.google.gms.google-services" not in text:
              match = re.search(r'plugins\s*\{', text)
              if not match:
                  raise SystemExit("ERROR: Settings plugins block not found.")

              pos = match.end()
              text = text[:pos] + "\n    " + declaration + text[pos:]
              settings.write_text(text)

          text = app.read_text()

          if "com.google.gms.google-services" not in text:
              match = re.search(r'plugins\s*\{', text)
              if not match:
                  raise SystemExit("ERROR: App plugins block not found.")

              pos = match.end()
              text = text[:pos] + "\n    " + application + text[pos:]
              app.write_text(text)

          print("Firebase Gradle plugin configured.")
          PY

      - name: Verify Android compile SDK
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          app = next(
              (p for p in [
                  Path("android/app/build.gradle.kts"),
                  Path("android/app/build.gradle"),
              ] if p.exists()),
              None
          )

          if app is None:
              raise SystemExit("ERROR: App Gradle file not found.")

          text = app.read_text()

          match = re.search(
              r'compileSdk(?:Version)?\s*(?:=\s*)?(\d+)',
              text
          )

          if not match:
              raise SystemExit("ERROR: compileSdk could not be verified.")

          version = int(match.group(1))
          print("Detected app compile SDK:", version)

          if version < 36:
              raise SystemExit("ERROR: App compile SDK must be at least 36.")

          print("Compile SDK verification passed.")
          PY

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PartyNova-APK
          path: build/app/outputs/flutter-apk/app-release.apk
